<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030303" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="雷钰轩 · 个人主页与熔炉档案馆 —— 我于此言语，Thus I Speak。湖南大学金融与统计学院统计学类。" />
    <meta property="og:title" content="雷钰轩 · 个人主页" />
    <meta property="og:description" content="我于此言语 · Thus I Speak" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;500;700&family=Cinzel+Decorative:wght@400;700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>雷钰轩 · 个人主页 | 熔炉档案馆</title>
  </head>
  <body>
    <!-- SVG sprite — 所有图标 / 装饰的 <use> 源；线条统一取参考图的砂金与骨白 -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
      <defs>
        <!-- ── 四角版记角标 ── -->
        <g id="corner-tl" fill="none" stroke="#cfc2a5" stroke-width="0.9" opacity="0.55">
          <path d="M 18 2 L 2 2 L 2 18" />
          <path d="M 14 5 L 5 5 L 5 14" stroke-width="0.35" opacity="0.5" />
        </g>
        <g id="corner-tr" fill="none" stroke="#cfc2a5" stroke-width="0.9" opacity="0.55">
          <path d="M 2 2 L 18 2 L 18 18" />
          <path d="M 6 5 L 15 5 L 15 14" stroke-width="0.35" opacity="0.5" />
        </g>
        <g id="corner-bl" fill="none" stroke="#cfc2a5" stroke-width="0.9" opacity="0.55">
          <path d="M 18 18 L 2 18 L 2 2" />
          <path d="M 14 15 L 5 15 L 5 6" stroke-width="0.35" opacity="0.5" />
        </g>
        <g id="corner-br" fill="none" stroke="#cfc2a5" stroke-width="0.9" opacity="0.55">
          <path d="M 2 18 L 18 18 L 18 2" />
          <path d="M 6 15 L 15 15 L 15 6" stroke-width="0.35" opacity="0.5" />
        </g>

        <!-- ── 砖红角标（用于危险 / 返回等强调位置） ── -->
        <g id="corner-blood-tl" fill="none" stroke="#b4623a" stroke-width="1" opacity="0.5">
          <path d="M 18 2 L 2 2 L 2 18" />
          <circle cx="2" cy="2" r="1.6" fill="#b4623a" stroke="none" opacity="0.45" />
        </g>

        <!-- ── 分隔线 ── -->
        <g id="chain-divider" fill="none" stroke="#cfc2a5" stroke-width="0.5" opacity="0.35">
          <path d="M 0 6 L 28 6" />
          <path d="M 7 3.5 L 10 6 L 7 8.5" opacity="0.7" />
          <path d="M 21 3.5 L 18 6 L 21 8.5" opacity="0.7" />
        </g>
        <g id="section-divider" fill="none" stroke="#cfc2a5" stroke-width="0.5" opacity="0.28">
          <line x1="0" y1="5" x2="34" y2="5" />
          <line x1="66" y1="5" x2="100" y2="5" />
          <polygon points="50,1.5 53.5,5 50,8.5 46.5,5" />
          <circle cx="36" cy="5" r="1" fill="#cfc2a5" opacity="0.4" />
          <circle cx="64" cy="5" r="1" fill="#cfc2a5" opacity="0.4" />
        </g>
        <g id="rune-divider-alt" fill="none" stroke="#cfc2a5" stroke-width="0.5" opacity="0.22">
          <line x1="0" y1="6" x2="15" y2="6" />
          <line x1="25" y1="6" x2="40" y2="6" />
          <polygon points="20,3 23,6 20,9 17,6" fill="#cfc2a5" opacity="0.35" stroke="none" />
        </g>

        <!-- ── 标题两侧饰线 ── -->
        <g id="title-orn-l" fill="none" stroke="#cfc2a5" stroke-width="0.7" opacity="0.4">
          <path d="M 60 14 L 0 14" />
          <path d="M 60 10 L 24 10" stroke-width="0.35" opacity="0.6" />
          <path d="M 60 18 L 40 18" stroke-width="0.35" opacity="0.6" />
          <path d="M 0 10 L 0 18" stroke-width="0.6" />
          <polygon points="60,14 56,11.5 56,16.5" fill="#cfc2a5" opacity="0.45" stroke="none" />
        </g>
        <g id="title-orn-r" fill="none" stroke="#cfc2a5" stroke-width="0.7" opacity="0.4">
          <path d="M 0 14 L 60 14" />
          <path d="M 0 10 L 36 10" stroke-width="0.35" opacity="0.6" />
          <path d="M 0 18 L 20 18" stroke-width="0.35" opacity="0.6" />
          <path d="M 60 10 L 60 18" stroke-width="0.6" />
          <polygon points="0,14 4,11.5 4,16.5" fill="#cfc2a5" opacity="0.45" stroke="none" />
        </g>

        <!-- ── 菱形符点 ── -->
        <g id="rune-bullet" fill="#cfc2a5" opacity="0.7">
          <polygon points="6,0 12,6 6,12 0,6" />
          <polygon points="6,3 9,6 6,9 3,6" fill="#0e0e0b" />
        </g>

        <!-- ── 日轮（放射刻线 + 中心菱形白光） ── -->
        <g id="sun-gate" fill="none" stroke="#ece4d3" stroke-width="0.6" opacity="0.5">
          <circle cx="40" cy="40" r="17" />
          <circle cx="40" cy="40" r="13" stroke-width="0.3" opacity="0.6" />
          <g opacity="0.75">
            <line x1="40" y1="2" x2="40" y2="20" />
            <line x1="40" y1="60" x2="40" y2="78" />
            <line x1="2" y1="40" x2="20" y2="40" />
            <line x1="60" y1="40" x2="78" y2="40" />
            <line x1="13" y1="13" x2="25" y2="25" />
            <line x1="55" y1="55" x2="67" y2="67" />
            <line x1="13" y1="67" x2="25" y2="55" />
            <line x1="55" y1="25" x2="67" y2="13" />
          </g>
          <polygon points="40,32 44.5,40 40,48 35.5,40" fill="#ece4d3" stroke="none" opacity="0.9" />
        </g>

        <!-- ── 拱门轮廓 ── -->
        <g id="arch-line" fill="none" stroke="#cfc2a5" stroke-width="0.8" opacity="0.4">
          <path d="M 0 120 L 0 44 A 40 44 0 0 1 80 44 L 80 120" />
          <path d="M 10 120 L 10 48 A 30 34 0 0 1 70 48 L 70 120" stroke="#8fa3ae" stroke-width="0.4" opacity="0.7" />
        </g>

        <!-- ── 制图十字 ── -->
        <g id="crosshair-mark" fill="none" stroke="#cfc2a5" stroke-width="0.6" opacity="0.5">
          <line x1="0" y1="6" x2="12" y2="6" />
          <line x1="6" y1="0" x2="6" y2="12" />
          <circle cx="6" cy="6" r="2.4" stroke-width="0.4" opacity="0.7" />
        </g>

        <!-- ── 金色飞鸟符形（官方主题图中漂浮的砂金符形） ── -->
        <g id="gold-bird" fill="none" stroke="#c9ab6e" stroke-width="0.8" opacity="0.7">
          <path d="M 3.5 11.5 C 7.5 4.5, 13.5 2, 21 3 C 16.5 5, 13 8.5, 11 14 C 9 10.8, 6.2 10.4, 3.5 11.5 Z" />
          <path d="M 6.6 10.9 L 2.4 14.6" stroke-width="0.6" opacity="0.8" />
          <circle cx="12.6" cy="5.6" r="0.75" fill="#c9ab6e" stroke="none" />
        </g>

        <!-- ── 文件类型图标 ── -->
        <g id="icon-document" fill="none" stroke="#8fa3ae" stroke-width="1.1" opacity="0.9">
          <path d="M 5 2 L 15 2 L 19 6 L 19 22 L 5 22 Z" />
          <path d="M 15 2 L 15 6 L 19 6" />
          <line x1="8" y1="11" x2="16" y2="11" stroke-width="0.7" opacity="0.75" />
          <line x1="8" y1="15" x2="14" y2="15" stroke-width="0.7" opacity="0.75" />
          <line x1="8" y1="19" x2="12" y2="19" stroke-width="0.7" opacity="0.75" />
        </g>
        <g id="icon-folder" fill="none" stroke="#beaa85" stroke-width="1.1" opacity="0.9">
          <path d="M 2 4 L 9 4 L 12 7 L 22 7 L 22 20 L 2 20 Z" />
          <line x1="4" y1="11" x2="20" y2="11" stroke-width="0.5" opacity="0.5" />
        </g>
        <g id="icon-image" fill="none" stroke="#b4623a" stroke-width="1.1" opacity="0.9">
          <rect x="3" y="4" width="18" height="16" />
          <circle cx="9" cy="9.5" r="1.8" />
          <path d="M 3 17.5 L 9 12.5 L 14 17.5 L 18 13.5 L 21 17" stroke-width="0.7" />
        </g>
        <g id="icon-archive" fill="none" stroke="#c9ab6e" stroke-width="1.1" opacity="0.9">
          <path d="M 3 6 L 21 6 L 19 21 L 5 21 Z" />
          <line x1="2" y1="3.5" x2="22" y2="3.5" stroke-width="0.9" />
          <line x1="9" y1="10" x2="15" y2="10" stroke-width="0.7" opacity="0.8" />
          <line x1="10" y1="14" x2="14" y2="14" stroke-width="0.7" opacity="0.8" />
        </g>
        <g id="icon-other" fill="none" stroke="#6e675a" stroke-width="1.1" opacity="0.95">
          <path d="M 6 2 L 15 2 L 19 6 L 19 22 L 6 22 Z" />
          <path d="M 15 2 L 15 6 L 19 6" />
        </g>

        <!-- ── 控件图标 ── -->
        <g id="arrow-left" fill="none" stroke="#cfc2a5" stroke-width="1.2" opacity="0.75">
          <path d="M 14 4 L 6 12 L 14 20" />
          <line x1="6" y1="12" x2="20" y2="12" stroke-width="0.8" opacity="0.55" />
        </g>
        <g id="chevron-right" fill="none" stroke="#6e675a" stroke-width="1" opacity="0.6">
          <path d="M 4 5 L 9 10 L 4 15" />
        </g>

        <!-- ── 装饰母题 ── -->
        <g id="ornament-flame" fill="none" stroke="#b4623a" stroke-width="0.8" opacity="0.5">
          <path d="M 12 2 C 8 8, 4 12, 4 16 C 4 20.5, 7.5 24, 12 24 C 16.5 24, 20 20.5, 20 16 C 20 12, 16 8, 12 2 Z" />
          <path d="M 12 7 C 10 11, 8.5 13.5, 8.5 16 C 8.5 18.4, 10 20.5, 12 20.5 C 14 20.5, 15.5 18.4, 15.5 16 C 15.5 13.5, 14 11, 12 7 Z" fill="#b4623a" fill-opacity="0.08" />
        </g>
        <g id="rune-ring" fill="none" stroke="#cfc2a5" stroke-width="0.5" opacity="0.4">
          <circle cx="16" cy="16" r="14" />
          <circle cx="16" cy="16" r="11" stroke-width="0.25" opacity="0.7" />
          <circle cx="16" cy="16" r="3.5" stroke-width="0.35" />
          <line x1="16" y1="2" x2="16" y2="6" opacity="0.6" /><line x1="16" y1="26" x2="16" y2="30" opacity="0.6" />
          <line x1="2" y1="16" x2="6" y2="16" opacity="0.6" /><line x1="26" y1="16" x2="30" y2="16" opacity="0.6" />
          <polygon points="16,2 17,4 16,6 15,4" fill="#cfc2a5" opacity="0.5" stroke="none" />
          <polygon points="16,26 17,28 16,30 15,28" fill="#cfc2a5" opacity="0.5" stroke="none" />
          <polygon points="2,16 4,17 6,16 4,15" fill="#cfc2a5" opacity="0.5" stroke="none" />
          <polygon points="26,16 28,17 30,16 28,15" fill="#cfc2a5" opacity="0.5" stroke="none" />
        </g>
        <g id="furnace-emblem" fill="none" stroke="#cfc2a5" stroke-width="0.6" opacity="0.35">
          <path d="M 4 22 L 4 4 L 20 4 L 20 22 Z" />
          <path d="M 8 4 L 8 22" stroke-width="0.25" opacity="0.5" />
          <path d="M 16 4 L 16 22" stroke-width="0.25" opacity="0.5" />
          <path d="M 4 10 L 20 10" stroke-width="0.25" opacity="0.5" />
          <path d="M 4 16 L 20 16" stroke-width="0.25" opacity="0.5" />
          <circle cx="12" cy="13" r="3" stroke-width="0.4" />
          <polygon points="12,11 13.6,13 12,15 10.4,13" fill="#cfc2a5" opacity="0.35" stroke="none" />
        </g>

        <!-- ══════════════════════════════════════════════════════
             个人主页 · 控件图标
             用 currentColor 描边，颜色交给 CSS，便于跟随 KV 色板
             ══════════════════════════════════════════════════════ -->

        <!-- 下载 -->
        <g id="icon-download" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.92">
          <path d="M 12 3 L 12 15" />
          <path d="M 7 10.5 L 12 15.5 L 17 10.5" />
          <path d="M 4 18.5 L 4 20 L 20 20 L 20 18.5" stroke-width="1.2" />
        </g>

        <!-- 进入（拱门 + 指向门内的箭头） -->
        <g id="icon-enter" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.92">
          <path d="M 5 20 L 5 10 A 7 7 0 0 1 19 10 L 19 20" />
          <path d="M 9.5 12.5 L 14.5 12.5" stroke-width="1.2" />
          <path d="M 12.2 10.3 L 14.6 12.5 L 12.2 14.7" stroke-width="1.2" />
        </g>

        <!-- 向右箭头（档案馆入口） -->
        <g id="icon-arrow-right" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.9">
          <line x1="0" y1="10" x2="22" y2="10" />
          <path d="M 16 4 L 22 10 L 16 16" />
        </g>

        <!-- 向下箭头（滚动指示） -->
        <g id="icon-cue-arrow" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.95">
          <path d="M 3 5 L 12 14 L 21 5" />
        </g>

        <!-- 邮件 -->
        <g id="icon-mail" fill="none" stroke="currentColor" stroke-width="1.35" opacity="0.92">
          <rect x="2.5" y="5" width="19" height="14" />
          <path d="M 2.5 6 L 12 13 L 21.5 6" stroke-width="1.1" />
        </g>

        <!-- 关闭 -->
        <g id="icon-close" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.95">
          <path d="M 5 5 L 19 19" />
          <path d="M 19 5 L 5 19" />
        </g>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
